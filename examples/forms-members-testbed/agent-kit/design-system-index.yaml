components:
  - name: login-indicator
    contractPath: ./../../packages/wix-members/dist/contracts/login-indicator.jay-contract
    description: Shows member login state in site header/navigation. Provides
      login/register/logout buttons that redirect to Wix-hosted auth pages.
    source: plugin
    plugin: wix-members
    templates: []
  - name: auth-callback
    contractPath: ./../../packages/wix-members/dist/contracts/auth-callback.jay-contract
    description: Handles OAuth callback after Wix-hosted login/register. Place as
      keyed component on the callback page.
    source: plugin
    plugin: wix-members
    templates: []
  - name: protected-page
    contractPath: ./../../packages/wix-members/dist/contracts/protected-page.jay-contract
    description: Page-level login guard. Redirects visitors to login page if not
      authenticated. Use as a keyed component in the page head.
    source: plugin
    plugin: wix-members
    templates: []
  - name: aiditor-shell
    contractPath: ./../../node_modules/@jay-framework/aiditor/dist/aiditor-shell.jay-contract
    description: POC shell for AIditor — banner text until full sidebar + iframe UI lands
    source: plugin
    plugin: aiditor
    templates: []
