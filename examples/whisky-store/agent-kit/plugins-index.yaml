jay_stack_version: 0.0.0
plugins:
  - name: webmcp
    path: ./../../node_modules/@jay-framework/webmcp-plugin
    contracts: []
  - name: wix-cart
    path: ./../../packages/wix-cart
    contracts:
      - name: cart-indicator
        type: static
        path: ./../../packages/wix-cart/dist/contracts/cart-indicator.jay-contract
      - name: cart-page
        type: static
        path: ./../../packages/wix-cart/dist/contracts/cart-page.jay-contract
  - name: wix-server-client
    path: ./../../packages/wix-server-client
    contracts: []
  - name: wix-stores-v1
    path: ./../../packages/wix-stores-v1
    contracts:
      - name: product-page
        type: static
        path: ./../../packages/wix-stores-v1/dist/contracts/product-page.jay-contract
      - name: product-search
        type: static
        path: ./../../packages/wix-stores-v1/dist/contracts/product-search.jay-contract
      - name: category-page
        type: static
        path: ./../../packages/wix-stores-v1/dist/contracts/category-page.jay-contract
      - name: category-list
        type: static
        path: ./../../packages/wix-stores-v1/dist/contracts/category-list.jay-contract
    actions:
      - name: searchProducts
        description: Search products using Wix Stores Catalog V1 with page-based
          pagination. Supports text search, price and collection filtering,
          sorting, and returns price aggregation data.
        path: ./../../packages/wix-stores-v1/dist/actions/search-products.jay-action
      - name: getProductBySlug
        description: Get a single product by its URL slug using Catalog V1. Returns full
          ProductCardViewState or null if not found.
        path: ./../../packages/wix-stores-v1/dist/actions/get-product-by-slug.jay-action
      - name: getCollections
        description: Get available store collections for filtering products. V1 uses
          collections instead of categories. Returns collection details
          including name, slug, description, image, and product count.
        path: ./../../packages/wix-stores-v1/dist/actions/get-collections.jay-action
