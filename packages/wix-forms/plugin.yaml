name: wix-forms
# No module field for NPM packages - uses package main export by default

# Dynamic contracts — one contract generated per Wix form at agent-kit time (DL#36).
# Materializes as form/<slug>, all served by the shared wixForm component.
dynamic_contracts:
  - prefix: form
    component: wixForm
    generator: formContractGenerator

services:
  - name: wix-forms
    marker: WIX_FORMS_SERVICE
    description: Server-side Wix Forms schema and submission APIs

actions:
  - name: getFormSummary
    action: get-form-summary.jay-action
  - name: submitForm
    action: submit-form.jay-action

validators:
  - name: wix-forms-bindings
    handler: validateWixFormBindings
    description: Flags retired generic `fields` binding and unknown form-field tags

setup: setupWixForms
agentkit: generateWixFormsAgentKit
