name: wix-bookings
# No module field for NPM packages - uses package main export by default

contracts:
  - name: booking-flow
    contract: booking-flow.jay-contract
    component: bookingFlow
    description: Full booking flow (service list, slot picker, form, checkout)
    editingGuide: ./agent-kit/designer/wix-bookings-dashboard-content.md

services:
  - name: wix-bookings
    marker: WIX_BOOKINGS_SERVICE
    description: Server-side Bookings + ecom v2 checkout APIs

actions:
  - name: listServices
    action: list-services.jay-action
  - name: listSlots
    action: list-slots.jay-action
  - name: getParticipantForm
    action: get-participant-form.jay-action
  - name: createBooking
    action: create-booking.jay-action

validators:
  - name: wix-bookings-address-bindings
    handler: validateBookingFlowBindings
    description: Errors on a booking-flow page whose address binds an unknown part or leaves a part input unbound, and on a page with no address inputs when a service's participant form asks for an address (BOOKINGS-ADDRESS-UNBOUND; a warning when services.yaml cannot tell; suppress with wix-bookings allow-unbound-address)

setup: setupWixBookings
agentkit: generateWixBookingsAgentKit
description: Bookings setup and agent-kit service index for dashboard links
