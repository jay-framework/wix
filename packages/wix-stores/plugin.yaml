name: wix-stores
# No module field for NPM packages - uses package main export by default

contracts:
  - name: product-search
    contract: product-search.jay-contract
    component: productSearch
    description: Headless product search page
  # category-page removed — use product-search with prefix/category params instead
  - name: related-products
    contract: related-products.jay-contract
    component: relatedProducts
    description: Related products from the same category
  - name: category-list
    contract: category-list.jay-contract
    component: categoryList
    description: Category list listing the categories

# Dynamic contracts — materialized at setup time from site-specific data
dynamic_contracts:
  # Product page — base contract extended with data extension fields
  - prefix: 'product-page'
    component: productPage
    generator: productPageContractGenerator
    headTags:
      - title
      - meta:description

# Server actions (named exports from main module)
actions:
  - name: searchProducts
    action: search-products.jay-action
  - name: getProductBySlug
    action: get-product-by-slug.jay-action
  - name: getCategories
    action: get-categories.jay-action
  - name: getVariantStock
    action: get-variant-stock.jay-action

services:
  - name: wix-stores
    marker: WIX_STORES_SERVICE_MARKER
    description: Wix Stores Catalog V3 API (products, categories, inventory, customizations) with lazy-loaded caching

contexts:
  - name: wix-stores
    marker: WIX_STORES_CONTEXT
    description: Client-side stores access with product variant resolution and delegated cart operations

setup:
  handler: setupWixStores
  references: generateWixStoresReferences
  description: Validate Wix Stores service; generate category tree reference
