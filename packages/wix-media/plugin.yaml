name: wix-media

validators:
  - name: media-optimization
    handler: validate
    description: Validates Wix media URLs have optimization parameters

commands:
  - name: upload-public
    command: upload-public.jay-command
  - name: rebuild-index
    command: rebuild-index.jay-command

actions:
  - getMediaSettingsStatus
  - rebuildMediaCatalog

setup: setupWixMedia
agentkit: generateWixMediaAgentKit
description: Validates Wix Media Manager access, generates agent-kit media index

routes:
  - path: /wix-media/settings
    jayHtml: ./lib/pages/settings/page.jay-html
    component: mediaSettingsPage
    description: Wix Media Manager project settings — connection health and catalog rebuild
    devOnly: true
