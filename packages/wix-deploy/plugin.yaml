name: wix-deploy

setup: setupWixDeploy

validators:
  - name: static-filenames
    handler: validate
    description: Checks that static file paths have no spaces (Wix CDN replaces spaces with hyphens)

commands:
  - name: deploy
    command: deploy.jay-command
  - name: build-entry
    command: build-entry.jay-command
  - name: upload-backend
    command: upload-backend.jay-command
  - name: deploy-baas
    command: deploy-baas.jay-command
